<main style="padding-top: 100px;">
        <section class="gallery-page-container">
            
            <h1 class="section-title fade-up">Nuestra Galería</h1>
            <p class="subtitle fade-up">Capturas reales de momentos inolvidables en San Juan.</p>

            <div class="gallery-grid">
                <div class="gallery-item fade-up"><img src="imagenes/deco12.jpg" alt="Salón para eventos"></div>
                <div class="gallery-item fade-up"><img src="imagenes/quincho.jpg" alt="Quincho con parrilla"></div>
                <div class="gallery-item fade-up"><img src="imagenes/par31.jpg" alt="Jardín exterior"></div>
                <div class="gallery-item fade-up"><img src="imagenes/deco1.jpg" alt="Decoración de evento"></div>
                <div class="gallery-item fade-up"><img src="imagenes/par21.jpg" alt="Juegos para niños"></div>
                <div class="gallery-item fade-up"><img src="imagenes/par35.jpg" alt="Evento nocturno"></div>
                <div class="gallery-item fade-up"><img src="imagenes/par18.jpg" alt="Espacio para ferias"></div>
                <div class="gallery-item fade-up"><img src="imagenes/ninos-corriendo.jpg" alt="Niños jugando en el parque"></div>
            </div>

            <div class="contact-buttons fade-up" style="text-align: center; margin-top: 40px;">
                <a href="index.html#contacto" class="whatsapp-button">
                    <i class="fab fa-whatsapp"></i> Quiero reservar mi fecha
                </a>
            </div>
        </section>
    </main>

    <script>
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    </script>
